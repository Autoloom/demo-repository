<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autoloom Cable OS Demo</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to main content</a>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#/dashboard" aria-label="Autoloom dashboard">
          <span class="brand-mark">AL</span>
          <span>
            <strong>Autoloom</strong>
            <small>Cable OS</small>
          </span>
        </a>

        <nav class="nav-groups" id="sidebar-nav"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="route-phase">Phase 1</p>
            <h1 id="route-title">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <label class="role-control" for="role-select">
              <span>Role</span>
              <select id="role-select" name="role" autocomplete="off" aria-label="Select demo role">
                <option value="Owner">Owner</option>
                <option value="Operations">Operations</option>
                <option value="Accounts">Accounts</option>
                <option value="Sales">Sales</option>
              </select>
            </label>
            <div class="notif">
              <button class="icon-button notif-button" id="notif-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="notif-panel" title="AI-ready signals and issues">
                <span class="notif-icon" aria-hidden="true">!</span>
                <span>Issues</span>
                <span class="notif-count" id="notif-count" aria-hidden="true">0</span>
              </button>
              <div class="notif-panel" id="notif-panel" role="dialog" aria-label="AI-ready signals" hidden></div>
            </div>
            <button class="icon-button" id="reset-button" type="button" title="Reset demo data">Reset</button>
          </div>
        </header>

        <section id="content" class="content-panel" tabindex="-1" aria-live="polite"></section>
      </main>
    </div>

    <script src="assets/mock-data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
